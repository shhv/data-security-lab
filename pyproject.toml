[project]
name = "data-security-lab"
version = "0.1.0"
description = "Hands-on DSPM + DLP learning lab using only synthetic data"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["anthropic>=2.8"]  # optional: hosted LLM backend (Stage 6). Ollama needs nothing.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["datagen", "dspm", "dspm.classifiers", "dlp", "eval", "sqllab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
